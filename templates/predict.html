<!DOCTYPE html>
<html>
<head>
    <title>Festival Sales Predictor</title>
</head>
<body>
    <h2>🎉 Festival Sales Prediction</h2>
    <form method="POST">
        <label for="year">Enter Year (2026 or later):</label>
        <input type="number" id="year" name="year" required min="2026">
        <button type="submit">Predict</button>
    </form>

    {% if predictions %}
        <h3>📋 Predicted Quantities for {{ year }}</h3>
        <table border="1">
            <tr>
                <th>Festival</th>
                <th>Product</th>
                <th>Predicted Quantity</th>
            </tr>
            {% for row in predictions %}
            <tr>
                <td>{{ row['Festival'] }}</td>
                <td>{{ row['Product'] }}</td>
                <td>{{ row['Predicted_Quantity'] }}</td>
            </tr>
            {% endfor %}
        </table>
        <br>
        <img src="{{ url_for('static', filename='pie_chart.png') }}" alt="Pie Chart">
    {% endif %}
</body>
</html>
